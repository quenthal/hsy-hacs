[project]
name = "hsy-hacs"
version = "0.1.0"
description = "Unofficial Home Assistant integration for HSY eRaportti water and waste data"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
